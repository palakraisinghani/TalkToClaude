<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ClaudeCall">
  <!-- ClaudeCall: an agent on a call — a friendly face in a headset, talking -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2a383"/>
      <stop offset=".55" stop-color="#d97757"/>
      <stop offset="1" stop-color="#b2543a"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <!-- the voice -->
  <g fill="none" stroke="#fff" stroke-linecap="round" stroke-width="2.6">
    <path d="M51.5 28a6 6 0 0 1 0 8" opacity=".95"/>
    <path d="M55.5 24.5a11 11 0 0 1 0 15" opacity=".6"/>
  </g>
  <g transform="translate(-2.5 0)">
  <!-- the face -->
  <circle cx="30" cy="34" r="14.5" fill="#fff"/>
  <ellipse cx="25" cy="32.5" rx="2.1" ry="2.6" fill="#2b1b14"/>
  <ellipse cx="35" cy="32.5" rx="2.1" ry="2.6" fill="#2b1b14"/>
  <path d="M25.5 38.5q4.5 3.8 9 0" fill="none" stroke="#2b1b14" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="21.5" cy="37.5" r="1.9" fill="#f6b8a4"/>
  <circle cx="38.5" cy="37.5" r="1.9" fill="#f6b8a4"/>
  <!-- the headset -->
  <path d="M12.5 34a17.5 17.5 0 0 1 35 0" fill="none" stroke="#2b1b14" stroke-width="3.4" stroke-linecap="round"/>
  <rect x="9" y="29" width="7.5" height="12" rx="3.75" fill="#2b1b14"/>
  <rect x="43.5" y="29" width="7.5" height="12" rx="3.75" fill="#2b1b14"/>
  <path d="M12.5 40.5q1.5 8.5 11.5 8.8" fill="none" stroke="#2b1b14" stroke-width="2.4" stroke-linecap="round"/>
  <circle cx="25" cy="49.3" r="2.8" fill="#2b1b14"/>
  </g>
</svg>
